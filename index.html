<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Przypakowany Tata</title>
    <meta name="theme-color" content="#14161A" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
        // Skip the forced reload while Supabase is still parsing an auth
        // token out of the URL hash (magic link / OAuth redirect) - reloading
        // mid-way loses the in-progress sign-in.
        var hasAuthToken = /access_token|refresh_token|type=(signup|magiclink|recovery)/.test(window.location.hash);
        let reloaded = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (reloaded || hasAuthToken) return;
          reloaded = true;
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
